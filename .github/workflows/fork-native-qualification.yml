name: Fork native qualification

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  script-controls:
    if: github.repository == 'jspillers/nautilus_trader'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact PR merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install script prerequisites
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install pinned native compiler
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.99.0"
          cache: false
          rustflags: ""
      - name: Install Python for script controls
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Read the repository uv pin
        id: uv-version
        run: echo "uv_version=$(bash scripts/uv-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Install pinned uv for script controls
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.uv-version.outputs.uv_version }}
          enable-cache: false
      - name: Check toolchain pins and all script controls
        run: |
          make check-docker-toolchain-pins
          make check-jiff-features
          make test-scripts
  native-controls:
    # This workflow belongs to the maintained Remora fork, not an upstream contribution.
    if: github.repository == 'jspillers/nautilus_trader'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the exact PR merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native compiler and isolated test Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config redis-server
          sudo systemctl stop redis-server
          mkdir -p "$RUNNER_TEMP/redis"
          redis-server --bind 127.0.0.1 --port 6379 --save '' --appendonly no \
            --dir "$RUNNER_TEMP/redis" --daemonize yes \
            --pidfile "$RUNNER_TEMP/redis/pid"
          redis-cli -h 127.0.0.1 -p 6379 ping
      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.99.0"
          components: clippy
          cache: false
          rustflags: ""
      - name: Cache locked compiler dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fork-native-ci-pr
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Test native Redis bus and bounded publisher
        run: >-
          cargo test --locked --profile ci-pr -p nautilus-infrastructure
          --features redis --lib redis:: -- --test-threads=1
      - name: Test native Redis cache integration
        run: >-
          cargo test --locked --profile ci-pr -p nautilus-infrastructure
          --features redis --test integration test_cache_redis -- --test-threads=1
      - name: Test bounded asynchronous cache configuration
        run: >-
          cargo test --locked --profile ci-pr -p nautilus-common
          --lib cache::config::tests -- --test-threads=1
      - name: Test native journal writer and snapshot durability
        run: |
          cargo test --locked --profile ci-pr -p nautilus-event-store --lib
          cargo test --locked --profile ci-pr -p nautilus-event-store --test integration writer::
      - name: Test native Sandbox order and account lifecycle
        run: >-
          cargo test --locked --profile ci-pr -p nautilus-sandbox
          --test integration -- --test-threads=1
      - name: Test native Feather write and replay staging
        run: >-
          cargo test --locked --profile ci-pr -p nautilus-persistence
          --lib writer::feather::tests -- --test-threads=1
      - name: Test native Backtest expiry and inventory retention
        run: |
          cargo test --locked --profile ci-pr -p nautilus-backtest --lib config::tests
          cargo test --locked --profile ci-pr -p nautilus-backtest --test integration \
            test_binary_inventory_retention_ignores_duplicate_close_payouts -- --test-threads=1
          cargo test --locked --profile ci-pr -p nautilus-backtest --test integration \
            test_option_expiry_timer_closes_position_without_data_at_expiration -- --test-threads=1
          cargo test --locked --profile ci-pr -p nautilus-backtest --test integration \
            test_instrument_close_precedes_expiration_timer_at_same_timestamp -- --test-threads=1
      - name: Test native matching engine and maker queue controls
        run: |
          cargo test --locked --profile ci-pr -p nautilus-execution --lib matching_engine::
          cargo test --locked --profile ci-pr -p nautilus-execution --test integration matching_engine::
      - name: Lint the affected native crates
        run: >-
          cargo clippy --locked --profile ci-pr -p nautilus-infrastructure
          -p nautilus-sandbox -p nautilus-persistence -p nautilus-backtest
          -p nautilus-event-store -p nautilus-common -p nautilus-system
          -p nautilus-execution --all-targets -- -D warnings
      - name: Shut down test-only Redis
        if: always()
        run: redis-cli -h 127.0.0.1 -p 6379 shutdown nosave
